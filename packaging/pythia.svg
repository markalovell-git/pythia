<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- outer zodiac ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#3a3a6e" stroke-width="3"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="#2a2a50" stroke-width="1.5"/>
  <!-- cross of the angles -->
  <line x1="20" y1="64" x2="108" y2="64" stroke="#4a4a8a" stroke-width="1.5"/>
  <line x1="64" y1="20" x2="64" y2="108" stroke="#4a4a8a" stroke-width="1.5"/>
  <!-- planets -->
  <circle cx="64" cy="64" r="6" fill="#ffd700"/>
  <circle cx="92" cy="50" r="3.5" fill="#aaaaff"/>
  <circle cx="44" cy="84" r="3" fill="#88ccff"/>
  <circle cx="80" cy="92" r="2.5" fill="#cc88ff"/>
  <circle cx="40" cy="44" r="2.5" fill="#44bb88"/>
  <!-- aspect lines -->
  <line x1="92" y1="50" x2="44" y2="84" stroke="#7a7acc" stroke-width="1" opacity="0.6"/>
  <line x1="40" y1="44" x2="80" y2="92" stroke="#7a7acc" stroke-width="1" opacity="0.6"/>
</svg>
