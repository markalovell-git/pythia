[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrology_app"
version = "0.1.0"
authors = [{name = "Your Name", email = "your.email@example.com"}]
description = "A desktop astrology app with FastAPI backend and PyQt6 frontend"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyqt6>=6.10.2",
    "skyfield>=1.54",
    "sqlalchemy>=2.0.49",
    "timezonefinder>=6.5.0",
    "tzdata>=2026.2",
    "uvicorn>=0.39.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "isort>=6.1.0",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-qt>=4.4.0",
    "watchdog>=6.0.0",
]
