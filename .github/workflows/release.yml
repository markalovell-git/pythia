name: Release

# Build the AppImage and attach it to the GitHub Release when a vX.Y.Z tag is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04   # older glibc -> runs on a broad range of distros
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Check version matches tag
        # Guards against tagging without bumping app/__version__, which would
        # ship a build that thinks it's older than its own tag and update-loops.
        run: |
          VERSION="v$(uv run python -c 'import app; print(app.__version__)')"
          echo "tag=${GITHUB_REF_NAME}  __version__=${VERSION}"
          test "${GITHUB_REF_NAME}" = "${VERSION}"

      - name: Build AppImage
        run: bash scripts/build_appimage.sh

      - name: Smoke-test AppImage
        # Fails the release if the bundle can't load ephemeris/timezone data.
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./Pythia-x86_64.AppImage --selftest

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Pythia-x86_64.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install (Linux)

            Download **Pythia-x86_64.AppImage** below, then make it executable and run it:

            ```
            chmod +x Pythia-x86_64.AppImage
            ./Pythia-x86_64.AppImage
            ```

            Or right-click → Properties → "Allow executing file as program", then
            double-click. Nothing else is required — Python, Qt, and the star
            ephemeris are all bundled. Some distros need `libfuse2`
            (`sudo apt install libfuse2` on Debian/Ubuntu).

            Pythia auto-updates: on launch it checks for a newer release and offers
            to install it.
